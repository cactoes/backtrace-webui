<!DOCTYPE html>
<html lang="en">
    <head>
        <title>backtrace | Profile</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/files/profile.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="icon" type="image/x-icon" href="/files/icon.ico">
        <script type="module" src="/files/profile.js" defer></script>
    </head>
    <body>
        <main class="container">
            <header class="top-bar animated fade_in">
                <div class="logo" onclick="window.open('/', '_self')">
                    <svg width="32" height="32" viewBox="0 0 76 76"><path fill="#fff" d="M41.16 61.03C28.05 61.03 17.41 50.4 17.41 37.28c0-11.11 7.64-20.45 17.95-23.03-4.24 4.29-6.86 10.19-6.86 16.7 0 13.11 10.63 23.75 23.74 23.75 2 0 3.94-.25 5.8-.71-4.31 4.35-10.28 7.04-16.88 7.04z"/></svg>
                    BT Ltd.
                </div>
                <nav>
                    <a class="animated fade_in delay02" href="/home">home</a>
                    <a class="pfp" href="/account"><img id="i#pfp"></a>
                </nav>
            </header>

            <div class="profile-layout">
                <div class="panel identity animated fade_in delay02">
                    <div class="identity-top">
                        <div class="pfp" id="p#pfp-container">
                            <img id="p#pfp" style="display: none;">
                            <i class="fa-solid fa-user pfp-placeholder" id="p#pfp-placeholder"></i>
                        </div>
                        <div class="identity-text">
                            <h1 id="p#username"></h1>
                            <p class="joined">Joined <span id="p#joined"></span></p>
                            <div class="uuid-chip" id="p#uuid">
                                <span class="uuid-text"></span>
                                <i class="fa-regular fa-copy"></i>
                            </div>
                        </div>
                    </div>

                    <div class="meta" id="p#meta"></div>
                </div>

                <div class="right-column">
                    <div class="panel animated fade_in delay05">
                        <p class="bio" id="p#description"></p>
                    </div>

                    <div class="panel animated fade_in delay07">
                        <p class="label">Library</p>
                        <div class="stats-group">
                            <p class="stats-group-label">Anime <span id="p#anime-total"></span></p>
                            <div class="stats-grid" id="p#anime-stats"></div>
                        </div>
                        <div class="stats-group">
                            <p class="stats-group-label">Manga <span id="p#manga-total"></span></p>
                            <div class="stats-grid" id="p#manga-stats"></div>
                        </div>
                    </div>

                    <div class="panel animated fade_in delay1">
                        <p class="label">Services</p>
                        <div class="services" id="p#services"></div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
