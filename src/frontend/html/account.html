<!DOCTYPE html>
<html lang="en">
    <head>
        <title>backtrace | Account</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/files/account.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="icon" type="image/x-icon" href="/files/icon.ico">
        <script type="module" src="/files/account.js" defer></script>
    </head>
    <body>
        <main class="container">
            <header class="top-bar animated fade_in">
                <div class="logo" onclick="window.open('/', '_self')">
                    <svg width="32" height="32" viewBox="0 0 76 76"><path fill="#fff" d="M41.16 61.03C28.05 61.03 17.41 50.4 17.41 37.28c0-11.11 7.64-20.45 17.95-23.03-4.24 4.29-6.86 10.19-6.86 16.7 0 13.11 10.63 23.75 23.74 23.75 2 0 3.94-.25 5.8-.71-4.31 4.35-10.28 7.04-16.88 7.04z"/></svg>
                    BT Ltd.
                </div>
                <nav>
                    <a class="animated fade_in delay02" href="/home">home</a>
                    <a class="pfp" href="/account"><img id="i#pfp"></a>
                </nav>
            </header>

            <h2 class="section-title animated fade_in delay03">General</h2>
            <div class="content animated fade_in_up delay02">
                <div class="panel">
                    <p class="label">Profile Picture</p>
                    <div class="fileuploader">
                        <label id="fu#label">
                            <i class="fa-solid fa-arrow-up-from-bracket"></i>
                            <span>Choose file</span>
                            <input id="file" type="file" accept="image/png, image/jpg, image/jpeg" />
                        </label>
                        <button id="btn">Upload</button>
                    </div>
                    <p id="file_stats">No file selected</p>
                </div>

                <div class="panel">
                    <p class="label">UUID</p>
                    <div class="uuid-chip" id="ci#uuid">
                        <span class="uuid-text"></span>
                        <i class="fa-regular fa-copy"></i>
                    </div>
                </div>
            </div>

            <h2 class="section-title animated fade_in delay05">Info</h2>
            <div class="content animated fade_in_up delay03">
                <div class="panel">
                    <p class="label">Description</p>
                    <textarea id="ci#description" placeholder="user description ..." maxlength="255"></textarea>
                </div>
                <div class="panel">
                    <p class="label">Website</p>
                    <input type="text" name="website" id="ci#website" placeholder="https://example.com">
                </div>
                <div class="panel">
                    <p class="label">Location</p>
                    <input type="text" name="location" id="ci#location" placeholder="country">
                </div>
                <div class="panel">
                    <p class="label">Company</p>
                    <input type="text" name="company" id="ci#company" placeholder="company name">
                </div>
            </div>

            <h2 class="section-title animated fade_in delay07">Links</h2>
            <div class="content animated fade_in_up delay05">
                <div class="panel">
                    <p class="label">Egg Inc.</p>
                    <span class="input-button-combo">
                        <input type="text" name="egg-inc-id" id="ci#egg-inc-id" placeholder="EIxxxxxxxx">
                        <button class="invert" id="ci#egg-inc-display">Display</button>
                    </span>
                </div>
            </div>

            <h2 class="section-title animated fade_in delay07">Other</h2>
            <div class="content animated fade_in_up delay05">
                <div class="panel">
                    <p class="label">Permissions</p>
                    <div class="permissions" id="permissions"></div>
                </div>
            </div>
        </main>
    </body>
</html>
