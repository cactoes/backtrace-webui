<!DOCTYPE html>
<html lang="en">
    <head>
        <title>backtrace | Home</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/files/home.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="icon" type="image/x-icon" href="/files/icon.ico">
        <script type="module" src="/files/home.js" defer></script>
    </head>
    <body>
        <main id="main" class="container">
            <header class="top-bar animated fade_in">
                <div class="logo" onclick="window.open('/', '_self')">
                    <svg width="32" height="32" viewBox="0 0 76 76"><path fill="#fff" d="M41.16 61.03C28.05 61.03 17.41 50.4 17.41 37.28c0-11.11 7.64-20.45 17.95-23.03-4.24 4.29-6.86 10.19-6.86 16.7 0 13.11 10.63 23.75 23.74 23.75 2 0 3.94-.25 5.8-.71-4.31 4.35-10.28 7.04-16.88 7.04z"/></svg>
                    BT Ltd.
                </div>
                <nav>
                    <a class="pfp" href="/account"><img id="i#pfp"></a>
                </nav>
            </header>

            <h2 class="section-title animated fade_in delay02">Services</h2>

            <section class="section animated fade_in_up delay02">
                <span class="card" id="item#account" onclick="window.open('/account', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-user"></i>
                        <p>Account</p>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#services" onclick="window.open('/services', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-server"></i>
                        <p>Services</p>
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <h2 id="il#services">-</h2>
                            <p>Services</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#lists" onclick="window.open('/lists', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-list"></i>
                        <p>Lists</p>
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <h2 id="il#anime">-</h2>
                            <p>Anime's</p>
                        </div>
                        <div class="stat">
                            <h2 id="il#manga">-</h2>
                            <p>Manga's</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#passwords" onclick="window.open('/passwords', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-lock"></i>
                        <p>Passwords</p>
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <h2>hidden</h2>
                            <p>Passwords</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#streaming" onclick="window.open('/streaming', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-tv"></i>
                        <p>Streaming</p>
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <h2 id="il#shows">-</h2>
                            <p>Shows</p>
                        </div>
                        <div class="stat">
                            <h2 id="il#episodes">-</h2>
                            <p>Episodes</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#public">
                    <div class="card-header">
                        <i class="fa-solid fa-globe"></i>
                        <p>Public Profile</p>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>

                <span class="card" id="item#egg_inc_tool" onclick="window.open('/egg_inc_tool', '_self')">
                    <div class="card-header">
                        <i class="fa-solid fa-egg"></i>
                        <p>Egg Inc. Tool</p>
                    </div>
                    <div class="card-footer">
                        <div class="card-footer-icon">
                            <i class="fa-solid fa-angle-right"></i>
                        </div>
                    </div>
                </span>
            </section>

            <footer class="animated fade_in_up delay1">
                <p id="ver" class="version"></p>
                <p id="time" class="time"></p>
            </footer>
        </main>
    </body>
</html>
